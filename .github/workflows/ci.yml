name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install
      - name: shell tools
        run: sudo apt-get install -y shellcheck shfmt
      - name: cargo xtask ci
        run: cargo xtask ci

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install
      - run: cargo test --workspace --locked

  # Known vulnerabilities, licenses and dependency sources (see deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny --locked check
